<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap">
  <style>
    :root{
      --surface-page:#f5f3ff; --ink:#0b1b2a; --ink-soft:#59656f;
      --accent:#5b21b6; --accent-strong:#2e1065;
      --rule:rgba(11,27,42,0.14);
      --font-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
      --font-body:"Inter Tight","Helvetica Neue",Arial,sans-serif;
    }
    body{margin:0;background:var(--surface-page);color:var(--ink);font-family:var(--font-display);-webkit-font-smoothing:antialiased;}
    a{color:var(--accent);} a:hover{color:var(--accent-strong);}
    .wrap{padding:44px 44px;display:flex;flex-direction:column;gap:28px;}
    .meta{display:flex;flex-direction:column;gap:8px;}
    .meta span{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-soft);font-family:var(--font-body);}
    .meta b{font-size:19px;letter-spacing:-0.03em;font-weight:800;}
    .stage{height:300px;display:flex;align-items:flex-end;gap:40px;}
    .frame{width:300px;height:300px;background:#fff;border:1px solid var(--rule);border-radius:20px;
      display:flex;align-items:flex-end;justify-content:flex-start;padding:0 58px 66px;box-sizing:border-box;}
    .dot{background:var(--accent);border-radius:50%;flex:none;}
    .frame .dot{width:120px;height:120px;}
    .mini{display:flex;flex-direction:column;align-items:center;gap:14px;}
    .mini .cell{width:16px;height:16px;background:#fff;border:1px solid var(--rule);border-radius:4px;display:flex;align-items:flex-end;justify-content:flex-start;padding:0 3px 3px;box-sizing:border-box;}
    .mini .cell .dot{width:6px;height:6px;}
    .mini span{font-size:11px;letter-spacing:0.12em;color:var(--ink-soft);font-family:var(--font-body);}
    .note{font-size:14px;line-height:1.62;color:var(--ink-soft);font-family:var(--font-body);max-width:460px;}
    .note b{color:var(--ink);font-weight:600;font-family:var(--font-display);}
  </style>
</helmet>
<div class="wrap">
  <div class="meta">
    <span>Option A &middot; the period</span>
    <b>Just the stop</b>
  </div>
  <div class="stage">
    <div class="frame"><div class="dot"></div></div>
    <div class="mini"><div class="cell"><div class="dot"></div></div><span>16</span></div>
  </div>
  <p class="note"><b>The most literal reading of the brand line</b> &mdash; &ldquo;every deal begins with hello.&rdquo; One violet dot, sitting on the baseline where punctuation lives. Unmistakably his once learned; on its own in a cold tab it can read as a status light.</p>
</div>
</x-dc>
</body>
</html>
